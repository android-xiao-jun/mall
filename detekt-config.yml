build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 1

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

processors:
  active: true
  exclude:
    - 'DetektProgressListener'

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'

output-reports:
  active: true
  exclude: []

formatting:
  active: true
  android: true
  autoCorrect: true

style:
  active: true
  ForbiddenComment:
    active: false
  MagicNumber:
    active: false
  ReturnCount:
    active: true
    max: 5
  ThrowsCount:
    active: true
    max: 3

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 80
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
  ComplexMethod:
    active: true
    threshold: 20
  NestedBlockDepth:
    active: true
    threshold: 4

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false

empty-blocks:
  active: true

performance:
  active: true

potential-bugs:
  active: true

naming:
  active: true
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    excludeClassPattern: '$^'
    ignoreAnnotated:
      - 'Composable'
      - 'Test'
